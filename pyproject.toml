[project]
name = "finne-memory"
version = "0.1.0"
description = "Finné Memory: bounded, auditable authority derived from remembered operating history."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "sibyl-memory-client==0.8.0",
    "web3>=6.0",
    "py-solc-x>=2.0",
    "rich>=13.0",
    # Already installed in every environment as a transitive dependency of
    # web3 and py-solc-x. Declared explicitly under DECISION-027 so
    # finne/agent.py does not rely on a dependency edge this project does
    # not control. Adds nothing to the install footprint.
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
]
# There is deliberately no model-SDK extra. `finne/explain.py` is the
# only module PERMITTED to call a model (PREREQ-003 section 13) and,
# after four rounds of independent review, does not — so an `anthropic`
# extra would install a dependency nothing imports. See that module's
# docstring for the record.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["finne*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
